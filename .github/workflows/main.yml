name: Deploy BISL

on:
  push:
    branches: [ main ]
    paths:
      - "bisl-deploy/**"
      - "bisl-proof-transparency/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

env:
  BISL_OPT: /opt/bisl-deploy
  BISL_CRYPTO_PERSIST: /var/lib/bisl/organizations
  BISL_FABRIC_CACHE: /var/lib/bisl/fabric
  FABRIC_VERSION: "2.5.12"
  CA_VERSION: "1.5.15"

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rsync curl ca-certificates tar

      - name: Ensure durable dirs
        run: |
          sudo mkdir -p /var/lib/bisl/organizations /var/lib/bisl/fabric "${BISL_OPT}"
          sudo chown -R "$USER:$USER" /var/lib/bisl "${BISL_OPT}"

      - name: Sync code to /opt/bisl-deploy
        run: |
          chmod +x bisl-deploy/scripts/*.sh
          ./bisl-deploy/scripts/sync-to-opt.sh "$(pwd)/bisl-deploy" "${BISL_OPT}"

      - name: Install linux Fabric binaries
        working-directory: ${{ env.BISL_OPT }}
        run: |
          set -x
          ./scripts/ensure-fabric-binaries.sh
          ./fabric/bin/peer version

      - name: Ensure Fabric network + crypto
        working-directory: ${{ env.BISL_OPT }}
        run: |
          set -x
          ./scripts/persist-crypto.sh restore || echo "no durable crypto yet (first boot ok)"
          ./scripts/start-network.sh
          ./scripts/persist-crypto.sh save
          test -d fabric/test-network/organizations/peerOrganizations/org1.example.com/users/Admin@org1.example.com/msp/keystore

      - name: Setup RPC wallet
        working-directory: ${{ env.BISL_OPT }}/rpc
        run: |
          npm install --omit=dev
          FABRIC_ROOT=${{ env.BISL_OPT }}/fabric npm run setup:wallet
          test -f wallet/appUserOrg1.id

      - name: Deploy chaincode
        working-directory: ${{ env.BISL_OPT }}
        run: ./scripts/deploy-chaincode.sh

      - name: Persist crypto
        working-directory: ${{ env.BISL_OPT }}
        run: ./scripts/persist-crypto.sh save

      - name: Restart RPC service
        run: |
          set -euxo pipefail
          NODE_BIN="$(command -v node)"
          test -x "${NODE_BIN}"
          echo "Using node: ${NODE_BIN} ($("${NODE_BIN}" -v))"

          if [[ ! -f "${BISL_OPT}/rpc/.env" ]]; then
            if [[ -f "${BISL_OPT}/rpc/.env.example" ]]; then
              # systemd EnvironmentFile rejects bare comment-only quirks; keep KEY=VAL lines
              grep -E '^[A-Za-z_][A-Za-z0-9_]*=' "${BISL_OPT}/rpc/.env.example" > "${BISL_OPT}/rpc/.env" || true
            else
              cp "${BISL_OPT}/rpc/.env.vps" "${BISL_OPT}/rpc/.env"
            fi
            WRITE_KEY=$(openssl rand -hex 32)
            READ_KEY=$(openssl rand -hex 32)
            if grep -q 'change-me-write-key' "${BISL_OPT}/rpc/.env" 2>/dev/null; then
              sed -i "s/change-me-write-key/${WRITE_KEY}/" "${BISL_OPT}/rpc/.env"
              sed -i "s/change-me-read-key/${READ_KEY}/" "${BISL_OPT}/rpc/.env"
            else
              {
                echo "WRITE_API_KEY=${WRITE_KEY}"
                echo "READ_API_KEY=${READ_KEY}"
                echo "REQUIRE_AUTH=true"
              } >> "${BISL_OPT}/rpc/.env"
            fi
            echo "Generated API keys in ${BISL_OPT}/rpc/.env — save them"
          fi
          # Absolute FABRIC_ROOT for systemd (relative ../fabric breaks outside shell cwd tricks)
          if grep -q '^FABRIC_ROOT=' "${BISL_OPT}/rpc/.env"; then
            sed -i "s|^FABRIC_ROOT=.*|FABRIC_ROOT=${BISL_OPT}/fabric|" "${BISL_OPT}/rpc/.env"
          else
            echo "FABRIC_ROOT=${BISL_OPT}/fabric" >> "${BISL_OPT}/rpc/.env"
          fi
          grep -q '^DISCOVERY_AS_LOCALHOST=' "${BISL_OPT}/rpc/.env" || echo "DISCOVERY_AS_LOCALHOST=true" >> "${BISL_OPT}/rpc/.env"

          # Always rewrite unit so node path / WorkingDirectory stay correct on the host
          sudo tee /etc/systemd/system/bisl-rpc.service > /dev/null <<EOF
          [Unit]
          Description=BISL Proof Transparency RPC
          After=network-online.target docker.service
          Wants=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=${BISL_OPT}/rpc
          EnvironmentFile=-${BISL_OPT}/rpc/.env.vps
          EnvironmentFile=-${BISL_OPT}/rpc/.env
          Environment=FABRIC_ROOT=${BISL_OPT}/fabric
          Environment=PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          ExecStart=${NODE_BIN} ${BISL_OPT}/rpc/app.js
          Restart=on-failure
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF
          # tee preserves leading spaces from the heredoc indent — strip them
          sudo sed -i 's/^[[:space:]]*//' /etc/systemd/system/bisl-rpc.service

          sudo systemctl daemon-reload
          sudo systemctl enable bisl-rpc
          if ! sudo systemctl restart bisl-rpc; then
            sudo systemctl status bisl-rpc --no-pager || true
            sudo journalctl -u bisl-rpc -n 100 --no-pager || true
            exit 1
          fi
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:4000/health; then
              echo
              echo "Deploy OK"
              exit 0
            fi
            sleep 1
          done
          sudo systemctl status bisl-rpc --no-pager || true
          sudo journalctl -u bisl-rpc -n 100 --no-pager || true
          exit 1
